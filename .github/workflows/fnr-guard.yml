name: fnr-guard

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  fnr-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: navikt/fnr-guard@047878f888d426598524374154b220f171c153ad # v1.0.0
